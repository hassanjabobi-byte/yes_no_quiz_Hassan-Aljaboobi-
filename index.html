          <button class="license-accept-btn" id="acceptLicenseBtn">✅ موافق وأدخل التطبيق</button>
        </div>
      </div>
    `;
    modalDiv.style.display = 'block';
    
    document.getElementById('acceptLicenseBtn').addEventListener('click', () => {
      localStorage.setItem('quiz_license_accepted', 'true');
      modalDiv.style.display = 'none';
    });
  }

  // ========== SOUND FUNCTIONS ==========
  function playCorrectSound() {
    if (!soundEnabled) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      osc.type = "sine";
      gain.gain.value = 0.2;
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
      osc.stop(ctx.currentTime + 0.5);
      if (ctx.state === "suspended") ctx.resume();
    } catch(e) {}
  }

  function playWrongSound() {
    if (!soundEnabled) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 520;
      osc.type = "sawtooth";
      gain.gain.value = 0.35;
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.0);
      osc.stop(ctx.currentTime + 1.0);
      if (ctx.state === "suspended") ctx.resume();
    } catch(e) {}
  }

  function computePageScore(pIdx) {
    let correct = 0;
    for (let i = 0; i < pagesData[pIdx].length; i++) {
      const ans = userAnswers[pIdx][i];
      if (ans !== null && ans === pagesData[pIdx][i].correct) correct++;
    }
    return correct;
  }

  function computeGlobalScore() {
    let total = 0;
    for (let i = 0; i < TOTAL_PAGES; i++) total += computePageScore(i);
    return total;
  }

  function updateCardColor(pageIdx, qIdx) {
    const card = document.querySelector(`.page[data-page='${pageIdx}'] .q-card[data-idx='${qIdx}']`);
    if (!card) return;
    const ans = userAnswers[pageIdx][qIdx];
    const isCorrect = (ans !== null && ans === pagesData[pageIdx][qIdx].correct);
    card.classList.remove('correct', 'wrong');
    if (ans === null) return;
    if (isCorrect) card.classList.add('correct');
    else card.classList.add('wrong');
  }

  function updateDisplay(pageIdx) {
    const pageDiv = document.querySelector(`.page[data-page='${pageIdx}']`);
    if (pageDiv) {
      const scoreSpan = pageDiv.querySelector('.page-score-val');
      if (scoreSpan) scoreSpan.innerText = `${computePageScore(pageIdx)} / ${pagesData[pageIdx].length}`;
    }
    document.getElementById('globalScoreSpan').innerText = `🏆 Total: ${computeGlobalScore()} / ${TOTAL_QS}`;
  }

  function renderPage(pIdx) {
    const pageDiv = document.createElement('div');
    pageDiv.className = 'page';
    if (pIdx === currentPage) pageDiv.classList.add('active-page');
    pageDiv.setAttribute('data-page', pIdx);
    let html = `<div class="questions-wrapper">`;
    pagesData[pIdx].forEach((q, idx) => {
      const selected = userAnswers[pIdx][idx];
      let extraClass = '';
      if (selected !== null) extraClass = (selected === q.correct) ? 'correct' : 'wrong';
      const yesChecked = selected === true ? 'checked' : '';
      const noChecked = selected === false ? 'checked' : '';
      html += `
        <div class="q-card ${extraClass}" data-idx="${idx}">
          <div class="q-text">${pIdx * PER_PAGE + idx + 1}. ${escapeHtml(q.text)}</div>
          <div class="options">
            <label class="opt"><input type="radio" name="q_${pIdx}_${idx}" value="yes" ${yesChecked}> ✅ Yes</label>
            <label class="opt"><input type="radio" name="q_${pIdx}_${idx}" value="no" ${noChecked}> ❌ No</label>
          </div>
        </div>
      `;
    });
    const pageScore = computePageScore(pIdx);
    html += `</div><div class="page-footer">
      <div class="page-score">📊 Page score: <span class="page-score-val">${pageScore} / ${pagesData[pIdx].length}</span></div>
      <div>
        ${pIdx > 0 ? '<button class="nav-btn" data-prev>◀ Previous</button>' : ''}
        ${pIdx < TOTAL_PAGES - 1 ? '<button class="nav-btn" data-next>Next ▶</button>' : '<button class="nav-btn" data-finish>🏆 Final Result</button>'}
      </div>
    </div>`;
    pageDiv.innerHTML = html;
    return pageDiv;
  }

  function attachEvents() {
    for (let p = 0; p < TOTAL_PAGES; p++) {
      const container = document.querySelector(`.page[data-page='${p}']`);
      if (!container) continue;
      for (let q = 0; q < pagesData[p].length; q++) {
        const yesRadio = container.querySelector(`input[name="q_${p}_${q}"][value="yes"]`);
        const noRadio = container.querySelector(`input[name="q_${p}_${q}"][value="no"]`);
        const handler = () => {
          let newVal = null;
          if (yesRadio.checked) newVal = true;
          else if (noRadio.checked) newVal = false;
          if (newVal !== userAnswers[p][q]) {
            userAnswers[p][q] = newVal;
            if (newVal !== null) {
              if (newVal === pagesData[p][q].correct) playCorrectSound();
              else playWrongSound();
            }
            updateCardColor(p, q);
            updateDisplay(p);
          }
        };
        if (yesRadio) yesRadio.addEventListener('change', handler);
        if (noRadio) noRadio.addEventListener('change', handler);
      }
      const prevBtn = container.querySelector('[data-prev]');
      const nextBtn = container.querySelector('[data-next]');
      const finishBtn = container.querySelector('[data-finish]');
      if (prevBtn) prevBtn.addEventListener('click', () => changePage(p - 1));
      if (nextBtn) nextBtn.addEventListener('click', () => changePage(p + 1));
      if (finishBtn) finishBtn.addEventListener('click', showFinalResult);
    }
  }

  function changePage(newIdx) {
    if (newIdx >= 0 && newIdx < TOTAL_PAGES) {
      currentPage = newIdx;
      updatePageVisibility();
      rebuildNavButtons();
    }
  }

  function updatePageVisibility() {
    for (let i = 0; i < TOTAL_PAGES; i++) {
      const page = document.querySelector(`.page[data-page='${i}']`);
      if (page) {
        if (i === currentPage) page.classList.add('active-page');
        else page.classList.remove('active-page');
      }
    }
    document.querySelectorAll('.page-btn').forEach((btn, idx) => {
      if (idx === currentPage) btn.classList.add('active');
      else btn.classList.remove('active');
    });
  }

  function rebuildNavButtons() {
    const container = document.getElementById('pageButtons');
    let btns = '';
    for (let i = 0; i < TOTAL_PAGES; i++) {
      btns += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-nav-page="${i}">📖 ${i+1}</button>`;
    }
    container.innerHTML = btns;
    for (let i = 0; i < TOTAL_PAGES; i++) {
      const btn = document.querySelector(`[data-nav-page="${i}"]`);
      if (btn) btn.addEventListener('click', () => { currentPage = i; updatePageVisibility(); rebuildNavButtons(); });
    }
  }

  function renderAllPages() {
    const root = document.getElementById('pagesContainer');
    root.innerHTML = '';
    for (let i = 0; i < TOTAL_PAGES; i++) root.appendChild(renderPage(i));
    attachEvents();
    rebuildNavButtons();
    updateDisplay(currentPage);
  }

  function showFinalResult() {
    const total = computeGlobalScore();
    const percent = (total / TOTAL_QS) * 100;
    let message = '';
    if (total === TOTAL_QS) message = '🏅 PERFECT SCORE! ABSOLUTE MASTERY! 🏅';
    else if (percent >= 85) message = '🌟 EXCELLENT! YOU HAVE GREAT KNOWLEDGE! 🌟';
    else if (percent >= 70) message = '👍 VERY GOOD! KEEP LEARNING! 👍';
    else if (percent >= 50) message = '📚 GOOD EFFORT! REVIEW AND TRY AGAIN.';
    else message = '💪 COURAGE! EVERY MISTAKE MAKES YOU STRONGER!';

    const finalDiv = document.getElementById('finalResultArea');
    finalDiv.innerHTML = `
      <div class="final-panel">
        <h2>🏁 FINAL RESULT 🏁</h2>
        <div class="final-score">${total} / ${TOTAL_QS}</div>
        <div style="margin: 10px 0;">📊 ${percent.toFixed(1)}% ACCURACY</div>
        <div style="margin: 15px 0;">${message}</div>
        <button id="restartQuizBtn" style="background:#dc4c2c; border:none; color:white; padding:10px 30px; border-radius:40px; font-weight:bold;">🔄 RESTART QUIZ</button>
      </div>
    `;
    document.getElementById('restartQuizBtn')?.addEventListener('click', () => {
      userAnswers = pagesData.map(p => new Array(p.length).fill(null));
      renderAllPages();
      finalDiv.innerHTML = '';
      currentPage = 0;
      updatePageVisibility();
      rebuildNavButtons();
    });
    finalDiv.scrollIntoView({ behavior: 'smooth' });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
  }

  const soundToggle = document.getElementById('soundToggleBtn');
  soundToggle.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundToggle.innerText = soundEnabled ? "🔊 Sound ON" : "🔇 Sound OFF";
  });

  showLicenseIfNeeded();
  renderAllPages();
</script>
</body>
</html>
